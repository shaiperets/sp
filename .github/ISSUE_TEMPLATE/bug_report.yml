name: Bug report
description: Something on the site looks or behaves wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please do not report security issues here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site on ...
        2. Scroll to ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15, Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
